<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8f4; --card:#fff; --line:#e2e5dc; --ink:#1f2a24; --muted:#6b756d;
  --red-1:#fdeced; --red-2:#fad6da; --red-b:#ee9aa3; --red-t:#7a1f2b; --red-dot:#e5484d;
  --grn-1:#eaf6ef; --grn-2:#cdeddb; --grn-b:#6fc79a; --grn-t:#0f5132; --grn-dot:#1fa463;
  --navy:#1e2a5a; --gray:#b4bac5; --gray-b:#8e96a5;
  --font:'IBM Plex Sans Arabic','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  /* theme (default = KFU green) */
  --h1:#5a0a10; --h2:#8b1a22; --hero-t:#fff; --hero-sub:rgba(255,255,255,.84); --hero-ring:rgba(255,255,255,.13);
  --pill-bg:rgba(255,255,255,.1); --pill-b:rgba(255,255,255,.3);
  --badge-bg:#c9a877; --badge-t:#5a0a10; --dot:#c9a877;
  --acc:#a11d26; --acc-d:#5a0a10; --tint:#fbeeee; --soft:#f3d6d7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:18px}
.hidden{display:none!important}

/* ---------- hero (same identity as the reference) ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--h1),var(--h2));color:var(--hero-t);
  padding:calc(30px + env(safe-area-inset-top,0px)) 0 26px;border-bottom:1px solid rgba(0,0,0,.06)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1.5px solid var(--hero-ring);pointer-events:none}
.hero::before{width:460px;height:460px;left:-160px;bottom:-300px}
.hero::after{width:320px;height:320px;right:-110px;top:-190px}
.hero .wrap{position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500;opacity:.92;margin-bottom:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--pill-b);background:var(--pill-bg)}
.hero-in{display:flex;align-items:center;gap:16px}
.badge{flex:none;white-space:nowrap;width:68px;height:68px;border-radius:20px;background:var(--badge-bg);color:var(--badge-t);display:grid;place-items:center;font-weight:700;font-size:1.3rem;box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.badge.emoji{font-size:2rem}
.badge.wordmark{font-size:1.05rem;letter-spacing:1px}
.hero h1{font-size:clamp(1.75rem,6vw,2.5rem);font-weight:700;line-height:1.35}
.hero p{color:var(--hero-sub);font-weight:300;font-size:1.02rem;margin-top:4px;line-height:1.7}
.pill{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:11px 22px;border:1px solid var(--pill-b);background:var(--pill-bg);border-radius:999px;font-size:.95rem;font-weight:400}
.lang-tg{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:16px;z-index:30;width:46px;height:46px;border-radius:50%;background:var(--acc-d);color:#fff;border:2px solid rgba(255,255,255,.85);font-weight:700;font-size:.85rem;display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(0,0,0,.5);transition:transform .2s}
.lang-tg:hover{transform:translateY(-3px) scale(1.06)}
.lang-tg:hover{background:rgba(255,255,255,.3)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--dot);flex:none}

/* ---------- tabs ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:10px;padding:18px 16px 14px;font-size:1.05rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:color .2s}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.cnt{background:var(--soft);color:var(--acc-d);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;font-family:var(--font)}
.main{padding-top:22px;padding-bottom:8px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}

/* ---------- home ---------- */
.lead{color:var(--muted);font-size:1rem;margin:2px 4px 16px;line-height:1.8}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.mcard{position:relative;display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:22px;background:var(--tint);
  border:1px solid color-mix(in srgb,var(--acc) 20%,#fff);transition:transform .25s,box-shadow .25s}
a.mcard:hover{transform:translateY(-4px);box-shadow:0 18px 34px -20px color-mix(in srgb,var(--acc) 80%,transparent)}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mcode{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--acc-d);background:#fff;border-radius:10px;padding:6px 14px;border:1px solid color-mix(in srgb,var(--acc) 14%,#fff)}
.mpill{background:var(--soft);color:var(--acc-d);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:600}
.mmain{display:flex;align-items:center;gap:14px}
.mic{flex:none;width:56px;height:56px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:1.9rem;border:1px solid color-mix(in srgb,var(--acc) 12%,#fff)}
.mmain h3{font-size:1.28rem;font-weight:700;line-height:1.35}
.mmain p{color:var(--muted);font-size:.9rem;font-weight:300;font-family:var(--font)}
.mbar{height:9px;border-radius:9px;background:#fff;overflow:hidden;border:1px solid color-mix(in srgb,var(--acc) 10%,#fff)}
.mbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.mfoot{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--acc-d);font-weight:500}
.mfoot .go{font-size:1.4rem;line-height:1;opacity:.6}
.mcard.soon{opacity:.85}
.mcard.soon .mpill{background:#f3e6cf;color:#7a5a1e}

/* ---------- graduation tab ---------- */
.summary{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{position:relative;width:160px;height:160px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--soft)}
.ring .fill{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center b{font-size:3rem;line-height:1;font-weight:700;color:var(--acc-d)}
.ring .center span{font-size:.85rem;color:var(--muted);margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--tint);border:1px solid color-mix(in srgb,var(--acc) 14%,#fff);border-radius:16px;padding:9px 16px;min-width:100px}
.stat b{display:block;font-size:1.3rem;line-height:1.25;color:var(--acc-d);font-weight:700}
.stat span{font-size:.8rem;color:var(--muted)}
.grad{display:none;margin-top:12px;font-weight:700;background:var(--soft);color:var(--acc-d);padding:8px 16px;border-radius:14px;width:fit-content}
.summary.done .grad{display:block}
.hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 4px 4px;color:var(--muted);font-size:.93rem}
.key{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;color:var(--ink);font-size:.85rem}
.key i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lvltable{margin-top:20px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line);
  display:flex;flex-direction:column;gap:1px}
.lvlrow{display:flex;align-items:stretch;background:var(--line);gap:1px}
.lvl-label{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  text-align:center;font-weight:700;font-size:.64rem;background:#3d6f99;color:#fff;padding:6px 3px;line-height:1.25}
.sem-all{font-size:.56rem;padding:2px 5px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-weight:600;color:#fff;white-space:nowrap}
.sem-all:hover{background:rgba(255,255,255,.3)}
.lvlcells{flex:1;display:flex;flex-wrap:nowrap;gap:1px;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.course{
  direction:rtl;text-align:center;flex:none;width:76px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:5px 3px;background:var(--red-t2,#7c2b30);color:#fff;transition:background .3s,transform .15s,box-shadow .2s;position:relative}
.course:hover{transform:scale(1.015);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.course:active{transform:scale(.98)}
.course b{font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.1px}
.course .cname{font-size:.56rem;font-weight:400;line-height:1.22;overflow-wrap:anywhere}
.course .cname small{display:block;font-size:.54rem;margin-top:1px;opacity:.92;font-weight:500}
.course .ccr{font-size:.52rem;opacity:.9}
.course.done{background:var(--grn-t2,#5c7a49)}
.course .stt2{position:absolute;top:5px;left:6px;font-size:.66rem;opacity:.85}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:26px}
.reset{padding:11px 22px;border-radius:14px;background:#f1f2ec;border:1px solid var(--line);font-weight:600;font-size:.92rem;color:var(--muted)}
.share-btn{padding:11px 22px;border-radius:14px;background:var(--tint);border:1px solid color-mix(in srgb,var(--acc) 30%,#fff);font-weight:600;font-size:.92rem;color:var(--acc-d)}
.print-head{display:none}
@media print{
  body *{visibility:hidden}
  .print-head,.print-head *,#summary,#summary *,.hint,.hint *,.lvltable,.lvltable *{visibility:visible}
  .print-head{display:block;text-align:center;margin-bottom:14px}
  .print-head h2{margin:0 0 4px;font-size:1.3rem}
  .print-head p{margin:0;color:var(--muted);font-size:.9rem}
  #summary{position:relative;top:0;left:0;width:100%;box-shadow:none;border:1px solid var(--line);margin:0 auto 14px}
  .hint{position:relative;top:0;left:0;justify-content:center;margin:0 auto 14px}
  .lvltable{position:relative;top:0;left:0;width:100%;margin:0 auto}
  .lvlrow{break-inside:avoid;page-break-inside:avoid}
  .lvlcells{flex-wrap:wrap!important;overflow:visible!important}
  .sem-all{display:none!important}
  .site-foot,.hero,.tabs,.scroll-hint2,.actions{display:none!important}
}
.onboard-ov{position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.onboard-ov.top{align-items:center}
.onboard-card{background:var(--card);border-radius:20px;max-width:400px;width:100%;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:onbUp .25s ease}
@keyframes onbUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.onboard-card h3{margin:0 0 12px;font-size:1.15rem}
.onboard-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.onboard-steps .ostep{display:flex;align-items:flex-start;gap:10px}
.onboard-steps .oi{font-size:1.3rem;flex:none}
.onboard-steps b{display:block;font-size:.92rem}
.onboard-steps span{color:var(--muted);font-size:.85rem;line-height:1.7}
.onboard-go{width:100%;padding:13px;border-radius:14px;background:var(--acc,#7a1f2b);color:#fff;font-weight:700;font-size:.95rem}
.scroll-hint2{font-size:.78rem;color:var(--muted);margin:0 4px 8px}

/* ---------- tree tab ---------- */
.tinfo{margin-bottom:12px;min-height:96px}
.tip{color:var(--muted);line-height:1.9;font-size:.98rem}
.tsel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;direction:ltr;justify-content:flex-end;margin-bottom:10px}
.tsel-h b{font-size:1.1rem;font-weight:700}
.tcode{font-family:var(--mono);font-size:.76rem;font-weight:600;color:var(--acc-d);background:var(--soft);padding:3px 9px;border-radius:8px}
.tcr{font-size:.74rem;color:var(--muted);font-weight:500}
.trow{display:flex;align-items:flex-start;gap:10px;margin-top:9px;flex-wrap:wrap}
.trow h4{font-size:.85rem;font-weight:700;min-width:82px;padding-top:6px;color:var(--ink)}
.trow em{font-style:normal;color:var(--muted);font-size:.9rem;padding-top:5px}
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.chip{direction:ltr;text-align:left;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:12px;font-size:.84rem;font-weight:500;border:1.5px solid transparent}
.chip span{font-family:var(--mono);font-size:.72rem;font-weight:600}
.chip.dep{background:var(--gray);border-color:var(--gray-b);color:#1f2937}
.chip.pre{background:#eef1fb;border:1.5px dashed var(--navy);color:var(--navy)}
.chip.co{background:#f1f3f6;border:1.5px dashed var(--gray-b);color:#3b4453}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 4px 12px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border:1.5px solid transparent}
.lg-sel{background:var(--navy)}.lg-dep{background:var(--gray);border-color:var(--gray-b)!important}
.lg-pre{background:#eef1fb;border:1.5px dashed var(--navy)!important}
.scroll-hint{font-size:.82rem;color:var(--muted);margin:0 6px 8px}
.tree-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 0 6px}
.tree-scroll{overflow-x:auto;direction:ltr;padding:0 18px 16px;-webkit-overflow-scrolling:touch}
.tree{position:relative;display:grid;grid-template-columns:repeat(8,176px);column-gap:42px;width:max-content}
.tcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.thead{text-align:center;padding:8px 6px;border-radius:14px;background:var(--tint);border:1px solid color-mix(in srgb,var(--acc) 14%,#fff);direction:rtl}
.thead small{display:block;color:var(--muted);font-size:.72rem}
.thead b{font-size:.92rem;color:var(--acc-d);font-weight:700}
.tnode{position:relative;direction:ltr;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;padding:9px 11px;border-radius:14px;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);transition:opacity .25s,background .25s,border-color .25s,transform .15s;box-shadow:0 2px 6px -4px rgba(0,0,0,.25)}
.tnode:hover{transform:translateY(-2px);border-color:var(--acc)}
.tnode .tcode{align-self:flex-start}
.tnode .tname{font-size:.84rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.tnode .tname small{display:block;font-size:.72rem;font-weight:500;opacity:.85;margin-top:3px}
.tnode .tcr{direction:rtl;unicode-bidi:isolate;align-self:flex-start}
.tnode .stt{position:absolute;top:7px;right:9px;font-size:.8rem;line-height:1}
.tnode.st-done{background:var(--grn-1);border-color:var(--grn-b)}
.tnode.st-done .stt{top:8px;width:18px;height:18px;border-radius:50%;background:var(--grn-dot);color:#fff;display:grid;place-items:center;font-size:.68rem;font-weight:700}
.tnode.st-open{background:#fff;border-color:var(--grn-b);box-shadow:0 0 0 3px rgba(31,164,99,.12)}
.tnode.st-lock{background:#f4f4f0;color:#8b928c}
.tnode.st-lock .tcode{background:#e9eae4;color:#8b928c}
.tree[data-filt=done] .tnode:not(.st-done),.tree[data-filt=open] .tnode:not(.st-open),.tree[data-filt=lock] .tnode:not(.st-lock){opacity:.28}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:.88rem;transition:all .2s}
.fchip b{background:var(--soft);color:var(--acc-d);border-radius:999px;padding:1px 10px;font-size:.82rem}
.fchip.on{border-color:var(--acc);background:var(--tint)}
.tstat{display:inline-block;margin-bottom:6px;padding:5px 14px;border-radius:999px;font-size:.85rem;font-weight:700}
.tstat.done{background:var(--grn-2);color:var(--grn-t)}
.tstat.open{background:#e3f6ec;color:var(--grn-t)}
.tstat.lock{background:#eceee9;color:#5e665f}
.tree.has-sel .tnode{opacity:.38}
.tree.has-sel .tnode.sel,.tree.has-sel .tnode.dep,.tree.has-sel .tnode.pre,.tree.has-sel .tnode.co{opacity:1}
.tnode.sel{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 10px 22px -10px rgba(30,42,90,.8)}
.tnode.sel .tcode{background:rgba(255,255,255,.18);color:#dfe5ff}
.tnode.sel .tcr{color:#c9d1f5}
.tnode.dep{background:var(--gray);border-color:var(--gray-b);color:#1f2937}
.tnode.dep .tcode{background:rgba(255,255,255,.55);color:#2b3442}
.tnode.pre{background:#eef1fb;border:1.5px dashed var(--navy)}
.tnode.co{background:#f1f3f6;border:1.5px dashed var(--gray-b)}
svg.links{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
svg.links .e{fill:none;stroke:#c3c9bd;stroke-width:1.3;opacity:.75;transition:opacity .25s}
.has-sel svg.links .e{opacity:.1}
svg.links .e.out{stroke:var(--navy);stroke-width:2.6;opacity:1}
svg.links .e.in{stroke:var(--navy);stroke-width:2;stroke-dasharray:6 5;opacity:.9}
.note{margin:14px 6px 0;font-size:.82rem;color:var(--muted);line-height:1.8}

/* ---------- about + footer ---------- */
.about h2{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.about h3{font-size:1.05rem;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.about h3::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--acc)}
.about p{color:var(--muted);line-height:1.9;font-size:.97rem}
.feats{list-style:none;display:grid;gap:10px}
.feats li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--tint);border:1px solid color-mix(in srgb,var(--acc) 14%,#fff);line-height:1.8;font-size:.94rem}
.feats .fi{font-size:1.35rem;line-height:1.5;flex:none}
.feats b{display:block;color:var(--acc-d);font-weight:700}
.howto{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.howto summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--acc-d);list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:' ▾';font-size:.7rem}
.howto[open] summary::after{content:' ▴'}
.howto-plat{margin-top:10px}
.howto-plat b{display:block;font-size:.82rem;margin-bottom:4px;color:var(--ink)}
.howto-plat ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);line-height:1.7}
.avail{list-style:none;display:grid;gap:8px}
.avail li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:.95rem}
.avail small{font-weight:600;font-size:.78rem;padding:3px 12px;border-radius:999px;background:var(--soft);color:var(--acc-d)}
.avail small.soon{background:#f3e6cf;color:#7a5a1e}
.warn{margin-top:18px;padding:12px 14px;border-radius:14px;background:#fff7e6;border:1px solid #f0dcae;color:#7a5a1e;font-size:.88rem;line-height:1.8}

/* ---------- احسب مُعدلي ---------- */
.gpa-card h2{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.gpa-rows{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.gpa-row{display:grid;grid-template-columns:1fr 74px 130px 34px;gap:8px;align-items:center}
.gpa-row input[type=text]{background:var(--tint);border:1.5px solid color-mix(in srgb,var(--acc) 16%,#fff);border-radius:14px;padding:11px 12px;font-family:inherit;font-size:.92rem;color:var(--ink);min-width:0}
.gpa-row select{background:var(--tint);border:1.5px solid color-mix(in srgb,var(--acc) 16%,#fff);border-radius:14px;padding:11px 8px;font-family:inherit;font-size:.88rem;color:var(--acc-d);font-weight:600}
.gpa-row input::placeholder{color:var(--muted);font-weight:400}
.g-del{flex:none;width:32px;height:32px;border-radius:50%;background:#fbe7e8;color:#a4333a;font-weight:700;font-size:.9rem;display:grid;place-items:center;transition:background .2s}
.g-del:hover{background:#f6cfd1}
.g-pin{flex:none;width:32px;height:32px;display:grid;place-items:center;font-size:1rem;opacity:.85}
.gpa-add{margin-top:14px;padding:10px 18px;border-radius:999px;background:var(--tint);border:1.5px dashed color-mix(in srgb,var(--acc) 30%,#fff);color:var(--acc-d);font-weight:700;font-size:.9rem}
.gpa-add:hover{background:var(--soft)}
.gpa-prev{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.gpa-field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.gpa-field input{width:100%;background:var(--tint);border:1.5px solid color-mix(in srgb,var(--acc) 16%,#fff);border-radius:14px;padding:11px 12px;font-family:inherit;font-size:.95rem;color:var(--ink)}
.gpa-calc-btn{width:100%;margin-top:20px;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 14px 28px -14px color-mix(in srgb,var(--acc) 80%,transparent);transition:transform .15s}
.gpa-calc-btn:hover{transform:translateY(-2px)}
.gpa-result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.gpa-result.hidden{display:none}
.gstat{background:var(--tint);border:1px solid color-mix(in srgb,var(--acc) 14%,#fff);border-radius:16px;padding:14px 10px;text-align:center}
.gstat b{display:block;font-size:1.5rem;font-weight:800;color:var(--acc-d)}
.gstat span{font-size:.78rem;color:var(--muted);font-weight:500}
.gstat.hi{background:linear-gradient(135deg,var(--acc),var(--acc-d));border:none}
.gstat.hi b,.gstat.hi span{color:#fff}
@media(max-width:420px){.gpa-row{grid-template-columns:1fr 62px 104px 30px;gap:6px}}
.gpa-card h3{font-size:1.05rem;font-weight:700;margin:30px 0 6px;display:flex;align-items:center;gap:10px}
.gpa-card h3::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--acc)}
.gpa-card .lead{margin-bottom:0}
.rev-note{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:.88rem;line-height:1.8;font-weight:600}
.rev-note.ok{background:#eaf6ee;border:1px solid #b7e0c3;color:#1f6b3a}
.rev-note.bad{background:#fdeced;border:1px solid #ee9aa3;color:#7a1f2b}
.rev-note.done{background:#fff7e6;border:1px solid #f0dcae;color:#7a5a1e}
.site-foot{margin-top:44px;background:var(--acc-d);color:#fff;text-align:center;padding:30px 0 calc(26px + env(safe-area-inset-bottom,0px))}
.site-foot .wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.contact-h{font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:2px}
.contacts{display:flex;flex-direction:column;align-items:flex-start;align-self:flex-start;gap:14px;width:100%;max-width:280px;margin-inline-start:6px}
.tg-row{display:flex;align-items:center;gap:12px}
.tg{flex:none;width:46px;height:46px;border-radius:14px;background:#229ED9;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(0,0,0,.6);transition:transform .2s;border:2px solid rgba(255,255,255,.85);overflow:hidden}
.tg.round{border-radius:50%}
.tg:hover{transform:translateY(-3px) scale(1.05)}
.tg svg{width:24px;height:24px;fill:#fff}
.tg img{width:100%;height:100%;object-fit:cover;display:block}
.tg-label{color:#fff;font-weight:600;font-size:.92rem;line-height:1.5;text-align:right}
.notes-row{margin-top:2px}
.notes-row .tg-label{font-size:.88rem;font-weight:600}
.foot-div{width:56px;height:2px;background:rgba(255,255,255,.25);border-radius:2px;margin:6px 0}
.credit{color:#fff;font-size:.92rem;line-height:1.9;font-weight:500}
.credit-date{color:#fff;opacity:.8;font-size:.82rem}

.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast div{background:#1f2a24;color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:.95rem;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(16px);transition:.3s}
.toast.show div{opacity:1;transform:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media(max-width:560px){
  .summary{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{justify-content:center}
  .badge{width:58px;height:58px;border-radius:17px}
  .pill{font-size:.88rem;padding:10px 18px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  #confetti{display:none}
}

/* --------- تجهيز الخطط --------- */
MAJORS.forEach(m=>{
  const seen={};
  m.sems=m.plan.map((sem,ci)=>sem.map(([code,name,cr,ar])=>{
    const k=code+'|'+name; seen[k]=(seen[k]||0)+1;
    return {id:k+'|'+seen[k],code,name,ar:ar||'',cr,col:ci};
  }));
  m.total=m.sems.flat().reduce((s,c)=>s+c.cr,0);
});
function buildGraph(m){
  if(m.all)return;
  const all=m.sems.flat(); all.forEach((c,i)=>c.i=i); m.all=all;
  const byCode={}; all.forEach(c=>{if(!(c.code in byCode))byCode[c.code]=c.i});
  const directPre=all.map(()=>[]), directDep=all.map(()=>[]);
  m.co=all.map(()=>[]); m.edges=[];
  const rules=Object.assign({},PRE_COMMON,PRE_BY_MAJOR[m.id]||{});
  Object.entries(rules).forEach(([code,pres])=>{
    const t=byCode[code]; if(t===undefined)return;
    pres.forEach(pc=>{
      const s=byCode[pc];
      if(s===undefined||all[s].col>=all[t].col)return;
      if(directPre[t].includes(s))return;
      directPre[t].push(s); directDep[s].push(t); m.edges.push([s,t]);
    });
  });
  CO_REQ.forEach(([lab,th])=>{
    const a=byCode[lab],b=byCode[th]; if(a===undefined||b===undefined)return;
    m.co[a].push(b); m.co[b].push(a);
  });
  function closure(adj){
    return all.map((_,i)=>{
      const seen=new Set(),stack=[...adj[i]];
      while(stack.length){const x=stack.pop();if(!seen.has(x)){seen.add(x);adj[x].forEach(y=>stack.push(y));}}
      return [...seen];
    });
  }
  m.directPre=directPre; m.directDep=directDep;
  m.pre=closure(directPre);   // كل المتطلبات السابقة (تراكمي) — لتظليل الشجرة
  m.dep=closure(directDep);   // كل ما تفتحه هذه المادة (تراكمي) — لتظليل الشجرة
}


/* حالة كل مادة: done / open (كل متطلباتها منجزة) / lock */
function computeStatus(m,set){
  return m.all.map(c=>set.has(c.id)?'done':(m.directPre[c.i].every(j=>set.has(m.all[j].id))?'open':'lock'));
}

const KEY=id=>'grad-plan-v1:'+id;
function load(m){
  try{
    const raw=localStorage.getItem(KEY(m.id));
    const valid=new Set(m.sems.flat().map(c=>c.id));
    return new Set((raw?JSON.parse(raw):[]).filter(x=>valid.has(x)));
  }catch(e){return new Set()}
}
function save(m,set){ try{localStorage.setItem(KEY(m.id),JSON.stringify([...set]))}catch(e){} }
function doneHours(m,set){ return m.sems.flat().reduce((s,c)=>s+(set.has(c.id)?c.cr:0),0); }
async function shareProgress(m){
  const d=doneHours(m,state),rem=m.total-d,pct=m.total?Math.round(d/m.total*100):0;
  const text=LANG==='en'
    ? `My progress in ${mTitle(m)}: ${pct}% done (${rem} hours left to graduate) 🎓`
    : `تقدمي في ${m.name}: ${pct}% خلاص (باقي ${rem} ساعة للتخرج) 🎓`;
  const shareTextUrl=async()=>{
    if(navigator.share){ try{ await navigator.share({title:mTitle(m),text,url:location.href}); return }catch(e){} }
    window.print();
  };
  if(typeof html2canvas==='undefined'){ shareTextUrl(); return; }
  const summary=$('summary');
  if(!summary){ shareTextUrl(); return; }
  const pgrad=summary.closest('#p-grad');
  const hint=pgrad?.querySelector('.hint'), table=pgrad?.querySelector('.lvltable');
  const wrap=document.createElement('div');
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f7f8f4';
  wrap.style.cssText=`position:fixed;left:-9999px;top:0;background:${bg};padding:28px;width:820px;border-radius:20px;font-family:${getComputedStyle(document.body).fontFamily}`;
  wrap.innerHTML=`<div style="text-align:center;margin-bottom:16px"><div style="font-size:2rem">${esc(m.icon)}</div><h2 style="margin:6px 0 2px;font-size:1.25rem;color:var(--ink,#1f2a24)">${esc(mTitle(m))}</h2><p style="margin:0;color:var(--muted,#6b756d);font-size:.85rem">${esc(mSub(m))}</p></div>${summary.outerHTML}${hint?hint.outerHTML:''}${table?table.outerHTML:''}<p style="text-align:center;margin:16px 0 0;color:var(--muted,#6b756d);font-size:.75rem">${esc(LANG==='en'?'Kfu Plan - KFU':'خطتك كفو - جامعة الملك فيصل')}</p>`;
  wrap.querySelectorAll('.lvlcells').forEach(el=>{ el.style.flexWrap='wrap'; el.style.overflowX='visible'; });
  wrap.querySelectorAll('.lvlrow').forEach(el=>{ el.style.flexWrap='wrap'; });
  wrap.querySelectorAll('.sem-all').forEach(el=>{ el.style.display='none'; });
  document.body.appendChild(wrap);
  try{
    const canvas=await html2canvas(wrap,{backgroundColor:bg,scale:2,useCORS:true,windowWidth:wrap.scrollWidth,width:wrap.scrollWidth});
    wrap.remove();
    canvas.toBlob(async blob=>{
      if(!blob){ shareTextUrl(); return; }
      const fname=(LANG==='en'?'progress-':'تقدمي-')+m.id+'.png';
      const file=(typeof File!=='undefined')?new File([blob],fname,{type:'image/png'}):null;
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:mTitle(m),text}); return }catch(e){}
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast(t('تم حفظ صورة تقدمك 📸'));
    },'image/png');
  }catch(e){
    wrap.remove();
    shareTextUrl();
  }
}

function setLang(l){
  if(l===LANG)return;
  LANG=l;
  try{localStorage.setItem('site-lang',l)}catch(e){}
  document.documentElement.setAttribute('lang', l==='en'?'en':'ar');

  route();
}

function applyTheme(id){
  const root=document.documentElement;
  THEME_KEYS.forEach(k=>root.style.removeProperty(k));
  const t=THEMES[id];
  if(t)Object.entries(t).forEach(([k,v])=>root.style.setProperty(k,v));
  $('themeColor').setAttribute('content',t?t['--h1']:'#5a0a10');
}

/* --------- confetti --------- */
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y,n=26,cols,power=1){
  cols=cols||['#1fa463','#6fc79a','#c9a877','#ffd23f','#7ab8ff','#ee9aa3'];
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(3+Math.random()*6)*power;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3*power,g:.22,r:3+Math.random()*4,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:60+Math.random()*30});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.rot+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.life/25);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}

const GPA_GRADES=[
  ['A+','A+  ·  5.00'],['A','A  ·  4.75'],['B+','B+  ·  4.50'],['B','B  ·  4.00'],
  ['C+','C+  ·  3.50'],['C','C  ·  3.00'],['D+','D+  ·  2.50'],['D','D  ·  2.00'],
  ['E','E  ·  1.00'],['F','F  ·  0.00']
];
const GPA_POINTS={'A+':5,'A':4.75,'B+':4.5,'B':4,'C+':3.5,'C':3,'D+':2.5,'D':2,'E':1,'F':0};
function gpaRowHTML(row,locked){
  row = row || {name:'',hours:'',grade:''};
  return `<div class="gpa-row${locked?' locked':''}">
    <input type="text" class="g-name" placeholder="${t('اسم المادة (اختياري)')}" value="${esc(row.name||'')}">
    <select class="g-hours">
      <option value="">${t('الساعات')}</option>
      ${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${+row.hours===n?'selected':''}>${n}</option>`).join('')}
    </select>
    <select class="g-grade">
      <option value="">${t('التقدير')}</option>
      ${GPA_GRADES.map(([v,l])=>`<option value="${v}" ${row.grade===v?'selected':''}>${l}</option>`).join('')}
    </select>
    ${locked?`<span class="g-pin" title="${LANG==='en'?'First course always stays':'أول مادة دايمًا موجودة'}">📌</span>`:`<button class="g-del" aria-label="${LANG==='en'?'Remove course':'حذف المادة'}">✕</button>`}
  </div>`;
}
function gpaHTML(){
  return `<div class="card gpa-card">
    <h2>${t('احسب مُعدلي 🧮')}</h2>
    <p class="lead">${t('سجّل مواد فصلك وحدد تقدير كل مادة، وطلعلك المعدل الفصلي والتراكمي على طول — حسب نظام جامعة الملك فيصل (من 5.00).')}</p>
    <div id="gpaRows" class="gpa-rows"></div>
    <button id="gpaAdd" class="gpa-add" type="button">${t('+ أضف مادة')}</button>
    <div class="gpa-prev">
      <div class="gpa-field"><label>${t('ساعاتك التراكمية قبل هذا الفصل')}</label><input id="prevHours" type="number" min="0" inputmode="numeric" placeholder="${LANG==='en'?'e.g. 60':'مثلاً 60'}"></div>
      <div class="gpa-field"><label>${t('معدلك التراكمي قبل هذا الفصل')}</label><input id="prevGpa" type="number" min="0" max="5" step="0.01" inputmode="decimal" placeholder="${LANG==='en'?'e.g. 4.10':'مثلاً 4.10'}"></div>
    </div>
    <button id="gpaCalc" class="gpa-calc-btn" type="button">${t('احسب المعدل')}</button>
    <div id="gpaResult" class="gpa-result hidden">
      <div class="gstat"><b id="rHours">0</b><span>${t('ساعات الفصل')}</span></div>
      <div class="gstat"><b id="rPoints">0</b><span>${t('نقاط الفصل')}</span></div>
      <div class="gstat hi"><b id="rSem">0.00</b><span>${t('المعدل الفصلي')}</span></div>
      <div class="gstat hi"><b id="rCum">0.00</b><span>${t('المعدل التراكمي')}</span></div>
    </div>

const GPA_KEY='gpa-calc-v1';
function loadGpaState(){
  try{ return JSON.parse(localStorage.getItem(GPA_KEY)) || null }catch(e){ return null }
}
function saveGpaState(){
  try{
    const rows=[...document.querySelectorAll('#gpaRows .gpa-row')].map(r=>({
      name:r.querySelector('.g-name').value, hours:r.querySelector('.g-hours').value, grade:r.querySelector('.g-grade').value
    }));
    localStorage.setItem(GPA_KEY, JSON.stringify({
      rows, prevHours:$('prevHours').value, prevGpa:$('prevGpa').value,
      tgCur:$('tgCur')?.value||'', tgCurH:$('tgCurH')?.value||'', tgTarget:$('tgTarget')?.value||'', tgHours:$('tgHours')?.value||''
    }));
  }catch(e){}
}
function initGpa(){
  const box=$('gpaRows'); if(!box)return;
  if(box.dataset.inited)return; /* هذا العنصر بالذات مهيّأ فعلاً — ما نعيد التهيئة إلا لصفحة جديدة */
  box.dataset.inited='1';
  const saved=loadGpaState();
  const rows=(saved&&saved.rows&&saved.rows.length)?saved.rows:[{},{},{},{}];
  box.innerHTML=rows.map((r,i)=>gpaRowHTML(r,i===0)).join('');
  if(saved){
    $('prevHours').value=saved.prevHours||''; $('prevGpa').value=saved.prevGpa||'';
    $('tgCur').value=saved.tgCur||''; $('tgCurH').value=saved.tgCurH||'';
    $('tgTarget').value=saved.tgTarget||''; $('tgHours').value=saved.tgHours||'';
  }
  box.addEventListener('input',saveGpaState);
  box.addEventListener('change',saveGpaState);
  box.addEventListener('click',e=>{
    if(e.target.classList.contains('g-del')){
      e.target.closest('.gpa-row').remove();
      saveGpaState();
    }
  });
  $('gpaAdd').addEventListener('click',()=>{ box.insertAdjacentHTML('beforeend', gpaRowHTML()); saveGpaState(); });
  $('prevHours').addEventListener('input',saveGpaState);
  $('prevGpa').addEventListener('input',saveGpaState);
  $('gpaCalc').addEventListener('click',computeGpa);
  ['tgCur','tgCurH','tgTarget','tgHours'].forEach(id=>$(id).addEventListener('input',saveGpaState));
  $('tgCalc').addEventListener('click',computeTargetGpa);
}
function computeGpa(){
  let hours=0, points=0;
  document.querySelectorAll('#gpaRows .gpa-row').forEach(r=>{
    const h=+r.querySelector('.g-hours').value, g=r.querySelector('.g-grade').value;
    if(h && g){ hours+=h; points+=h*GPA_POINTS[g]; }
  });
  const semGpa = hours? points/hours : 0;
  const prevH = +$('prevHours').value||0, prevG = +$('prevGpa').value||0;
  const totH = prevH+hours, totP = (prevH*prevG)+points;
  const cumGpa = totH? totP/totH : 0;
  $('rHours').textContent=hours;
  $('rPoints').textContent=points.toFixed(2).replace(/\\.00$/,'');
  $('rSem').textContent=semGpa.toFixed(2);
  $('rCum').textContent=cumGpa.toFixed(2);
  $('gpaResult').classList.remove('hidden');
  saveGpaState();
}
function nearestGradeLabel(v){
  const sorted=Object.entries(GPA_POINTS).sort((a,b)=>a[1]-b[1]);
  for(const [g,val] of sorted){ if(val>=v-1e-9) return g; }
  return null;
}
function computeTargetGpa(){
  const cur=+$('tgCur').value, curH=+$('tgCurH').value, target=+$('tgTarget').value, nextH=+$('tgHours').value;
  const box=$('tgResult'), note=$('tgNote');
  note.className='rev-note';
  if(!curH||!target||!nextH||isNaN(cur)){
    box.classList.add('hidden');
    note.classList.remove('hidden'); note.classList.add('bad');
    note.textContent=t('عبّي كل الحقول الأول (معدلك، ساعاتك، المعدل اللي تبيه، وعدد الساعات الجايه).');
    saveGpaState(); return;
  }
  const needed=(target*(curH+nextH) - cur*curH) / nextH;
  box.classList.remove('hidden'); note.classList.remove('hidden');
  if(cur>=target){
    $('tgNeed').textContent='—';
    note.classList.add('done');
    note.textContent=t('ماشاء الله، معدلك خلاص وصل هدفك أو أعلى منه 🎉');
  }else if(needed>5){
    $('tgNeed').textContent='5.00+';
    note.classList.add('bad');
    note.textContent=t('ما راح توصله بهالعدد من الساعات حتى لو جبت A+ بكلها — زوّد عدد الساعات أو راجع هدفك.');
  }else{
    $('tgNeed').textContent=needed.toFixed(2);
    const g=nearestGradeLabel(needed);
    note.classList.add(needed>=4.5?'bad':'ok');
    note.textContent=(LANG==='en'
      ? `You need at least a "${g}" average across those hours to get there.`
      : `يعني لازم يكون معدلك بهالساعات الجايه "${g}" أو أعلى عشان توصل هدفك.`);
  }
  saveGpaState();
}

  app.querySelectorAll('.tnode').forEach(n=>{
    const k=stt[+n.dataset.i];
    n.classList.remove('st-done','st-open','st-lock');n.classList.add('st-'+k);
    n.querySelector('.stt').textContent=ICON[k];
  });
  $('fDone').textContent=stt.filter(x=>x==='done').length;
  $('fOpen').textContent=stt.filter(x=>x==='open').length;
  $('fLock').textContent=stt.filter(x=>x==='lock').length;
  if(!initial&&$('tinfo'))$('tinfo').innerHTML=infoHTML();
  m.sems.forEach((list,i)=>{
    const n=list.filter(c=>state.has(c.id)).length;
    const btn=app.querySelector(`[data-all="${i}"]`);
    if(btn)btn.textContent=n===list.length?t('إلغاء الكل'):t('تحديد الكل');
  });
  $('fill').style.strokeDashoffset=C*(1-(m.total?d/m.total:0));
  $('dn').textContent=d;
  $('cc').textContent=m.all.filter(c=>state.has(c.id)).length+'/'+m.all.length;
  $('pc').textContent=pct+'%';
  $('tabRem').textContent=rem;
  $('heroPill').textContent=rem===0&&m.total>0?t('🎓 خلّصت كل ساعات التخرج'):(LANG==='en'?`${rem} hrs left to graduate`:`متبقي ${rem} ساعة للتخرج`);
  countTo($('rem'),rem,initial);
  $('summary').classList.toggle('done',rem===0&&m.total>0);
}
function countTo(el,to,instant){
  const from=+el.textContent||0;
  if(instant||from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to;return}
  const t0=performance.now(),dur=500;
  (function step(t){const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0);
}
function afterChange(x,y,gained){
  save(cur,state);
  const rem=cur.total-doneHours(cur,state);
  refresh();
  if(gained){
    burst(x,y);
    if(rem===0){setTimeout(()=>{burst(innerWidth*.3,innerHeight*.35,70,undefined,1.6);burst(innerWidth*.7,innerHeight*.35,70,undefined,1.6)},250);toast(t('🎓 مبروك! خلّصت كل ساعات التخرج'))}
  }
}
function toggle(b,e){
  const id=b.dataset.id,was=state.has(id);
  was?state.delete(id):state.add(id);
  const r=b.getBoundingClientRect();
  afterChange(e.clientX||r.left+r.width/2,e.clientY||r.top+r.height/2,!was);
}
function toggleSem(i,e){
  const list=cur.sems[i],all=list.every(c=>state.has(c.id));
  list.forEach(c=>all?state.delete(c.id):state.add(c.id));
  afterChange(e.clientX,e.clientY,!all);
  if(!all)toast(t('تم تحديد مواد الفصل ✅'));
}

/* ---- الخطة الشجرية ---- */
function select(i){ sel=(sel===i)?null:i; filt=null; applySel(); }

function edgePath(a,b,tr){
  const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
  const x1=A.right-tr.left,y1=A.top+A.height/2-tr.top,x2=B.left-tr.left,y2=B.top+B.height/2-tr.top;
  const dx=Math.max(28,(x2-x1)*.45);
  return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2-2},${y2}`;
}
function drawLinks(){
  const m=cur; if(!m)return;
  const tree=$('tree'),svg=$('links'); if(!tree||!tree.offsetParent)return;
  const nodes=tree.querySelectorAll('.tnode'),tr=tree.getBoundingClientRect();
  svg.setAttribute('width',tree.scrollWidth);svg.setAttribute('height',tree.scrollHeight);
  if(!svgReady){
    svg.innerHTML=`<defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#b7bdb1"/></marker>
      <marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#1e2a5a"/></marker>
    </defs>`;
    paths=m.edges.map(e=>{
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','e');p.setAttribute('marker-end','url(#ah)');p.__e=e;svg.appendChild(p);return p;
    });
    svgReady=true;
  }
  paths.forEach(p=>p.setAttribute('d',edgePath(nodes[p.__e[0]],nodes[p.__e[1]],tr)));
}
function infoHTML(){
  const m=cur;
  if(sel===null)return LANG==='en'
    ? `<p class="tip">👆 Tap any course and it turns <b style="color:var(--navy)">navy</b>, and the courses it unlocks turn <b style="color:#5b6472">grey</b> with arrows connecting them.<br>🔓 Open now · 🔒 Locked until you finish its prerequisites · ✅ Done</p>`
    : `<p class="tip">👆 اضغط على أي مادة وتصير <b style="color:var(--navy)">كحلية</b>، والمواد اللي تفتحها تصير <b style="color:#5b6472">رصاصية</b> مع أسهم توصّل بينها.<br>🔓 متاحة لك الحين · 🔒 مقفلة لين تخلّص متطلباتها · ✅ منجزة</p>`;
  const c=m.all[sel],k=computeStatus(m,state)[sel];
  const chips=(arr,cls)=>arr.map(i=>`<button class="chip ${cls}" data-i="${i}"><span>${state.has(m.all[i].id)?'✓ ':''}${esc(m.all[i].code)}</span>${esc(m.all[i].name)}</button>`).join('');
  const row=(ti,arr,cls,empty)=>`<div class="trow"><h4>${ti}</h4>${arr.length?`<div class="chips">${chips(arr,cls)}</div>`:`<em>${empty}</em>`}</div>`;
  const label=LANG==='en'
    ? {done:'✅ Done',open:'🔓 Open now',lock:'🔒 Locked — missing prerequisites'}[k]
    : {done:'✅ منجزة',open:'🔓 متاحة لك الحين',lock:'🔒 مقفلة — ناقصك متطلباتها'}[k];
  const missing=m.directPre[sel].filter(i=>!state.has(m.all[i].id));
  const depCount=m.dep[sel].length;
  return `<span class="tstat ${k}">${label}</span>
    <div class="tsel-h"><span class="tcr">${c.cr} ${hrs(c.cr)}</span><b>${esc(c.name)}</b><span class="tcode">${esc(c.code)}</span></div>
    ${row(LANG==='en'?'Directly unlocks':'تفتح لك مباشرة',m.directDep[sel],'dep',LANG==='en'?"Doesn't unlock anything — end of the chain 🎉":'ما تفتح مواد بعدها — نهاية السلسلة 🎉')}
    ${depCount>m.directDep[sel].length?(LANG==='en'?`<p class="tip" style="margin:2px 0 0">Indirectly, it unlocks <b style="color:var(--navy)">${depCount}</b> courses total by the end of the plan (shaded grey in the tree).</p>`:`<p class="tip" style="margin:2px 0 0">وبشكل غير مباشر، تفتح لك <b style="color:var(--navy)">${depCount}</b> مادة إجمالاً حتى نهاية الخطة (مظلّلة بالرمادي في الشجرة).</p>`):''}
    ${m.directPre[sel].length?row(LANG==='en'?'Directly needs first':'تحتاج قبلها مباشرة',m.directPre[sel],'pre',''):''}
    ${k==='lock'&&missing.length?row(LANG==='en'?'Missing':'ناقصك',missing,'pre',''):''}
    ${m.co[sel].length?row(LANG==='en'?'Taken together with':'تؤخذ معها',m.co[sel],'co',''):''}`;
}
function applySel(){
  const m=cur,tree=$('tree'); if(!tree)return;
  const has=sel!==null;
  tree.classList.toggle('has-sel',has);
  tree.dataset.filt=filt||'';
  app.querySelectorAll('.fchip').forEach(b=>b.classList.toggle('on',b.dataset.f===filt));
  const dep=new Set(has?m.dep[sel]:[]),pre=new Set(has?m.pre[sel]:[]),co=new Set(has?m.co[sel]:[]);
  tree.querySelectorAll('.tnode').forEach((n,i)=>{
    n.classList.toggle('sel',i===sel);n.classList.toggle('dep',dep.has(i));
    n.classList.toggle('pre',pre.has(i));n.classList.toggle('co',co.has(i));
  });
  const svg=$('links');
  paths.forEach(p=>{
    const [a,b]=p.__e,out=has&&a===sel,inn=has&&b===sel;
    p.classList.toggle('out',out);p.classList.toggle('in',inn);
    p.setAttribute('marker-end',out||inn?'url(#ahn)':'url(#ah)');
    if(out||inn)svg.appendChild(p);
  });
  $('tinfo').innerHTML=infoHTML();
}
addEventListener('resize',()=>{if(tab==='tree')drawLinks()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(app.dataset.page==='plan'&&tab==='tree')drawLinks()});

/* --------- التنقل: #civil  أو  #civil/tree --------- */
function route(){
  const [id,t]=location.hash.replace('#','').split('/');
  const onHome=app.dataset.page==='home';
  if(id==='about'||id==='tree'||id==='gpa'){ onHome?showHomeTab(id):renderHome(id); return }
  const m=MAJORS.find(x=>x.id===id&&x.ready);
  if(!m){ onHome&&!id?showHomeTab('hours'):renderHome('hours'); return }
  const tt=(t==='tree'||t==='about'||t==='gpa')?t:'grad';
  if(app.dataset.page==='plan'&&app.dataset.major===m.id){showTab(tt);return}
  renderPlan(m,tt);
}
addEventListener('hashchange',route);
route();

/* --------- تلميح أول زيارة --------- */
const ONBOARD_KEY='onboard-seen-v1';
function showOnboarding(){
  try{ if(localStorage.getItem(ONBOARD_KEY))return }catch(e){}
  const ov=document.createElement('div');
  ov.className='onboard-ov';
  ov.innerHTML=`<div class="onboard-card">
    <h3>${t('حياك في خطتك كفو! 👋')}</h3>
    <div class="onboard-steps">
      <div class="ostep"><span class="oi">👆</span><div><b>${LANG==='en'?'Tap to complete':'اضغط عشان تخلّص'}</b><span>${t('اضغط على أي مادة عشان تعلّمها منجزة، وتصير خضراء وينقص عداد الساعات لحاله.')}</span></div></div>
      <div class="ostep"><span class="oi">🌳</span><div><b>${LANG==='en'?'The tree':'الشجرة'}</b><span>${t('روح لتبويب «الخطة الشجرية» وشوف أسهم توضّحلك كل مادة تحتاج ايش قبلها، وتفتح لك ايش بعدها.')}</span></div></div>
      <div class="ostep"><span class="oi">↔️</span><div><b>${LANG==='en'?'Swipe & share':'اسحب وشارك'}</b><span>${t('اسحب الجداول يمين ويسار، واستخدم زر «شارك/اطبع» عشان تصدّر أو تطبع ملخص تقدمك بألوانه.')}</span></div></div>
    </div>
    <button class="onboard-go" id="onboardGo">${t('تمام، فهمت 👍')}</button>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ try{localStorage.setItem(ONBOARD_KEY,'1')}catch(e){} ov.remove(); };
  $('onboardGo').addEventListener('click',close);
  ov.addEventListener('click',e=>{ if(e.target===ov)close(); });
}
showOnboarding();
</script>
